<h2>Sessions</h2><div class="card">${rows.length?[...rows].reverse().slice(0,12).map(x=>`<div class="row sp ch"><span><b>${esc(x.f.c.name)}</b> <small>${esc(x.f.s.name.split(':')[0])} · ${fmt(x.date)}${x.manual?' · manual':''}</small></span><span class="row"><span class="tag v">${fmtT(x.secs)}</span><button class="bt g2 sm" onclick="editSession('${x.id}')">Edit</button><button class="bt dn sm" aria-label="Delete session" onclick="delSession('${x.id}')">✕</button></span></div>`).join(''):'<span class="mu">No sessions in this selection.</span>'}</div>`}
/* ---------- achievements & profile ---------- */
const ACH=[['first_ch','First Chapter','Complete first study of a chapter.','◈',()=>chs().some(c=>c.st===2)],['ch10','Ten Chapters','Complete 10 chapters.','◆',()=>chs().filter(c=>c.st===2).length>=10],['first_rev','First Revision','Mark any revision done.','↻',()=>chs().some(c=>c.rv.some(Boolean))],['first_sub','Paper Conquered','Complete every chapter of a paper.','▲',()=>S.subjects.some(s=>s.ch.length&&s.ch.every(c=>c.st===2))],['rev1','Full Revision','Finish a full revision round of a paper.','⟳',()=>S.subjects.some(s=>s.ch.length&&[0,1,2].some(k=>s.ch.every(c=>c.rv[k])))],['grp','Group Conquered','Clear every paper in a group.','♛',()=>mils().some(m=>m.k.startsWith('g:'))],['spom','SPOM Starter','Complete any SPOM set.','✎',()=>spomN()>=1],['spall','SPOM Master','Complete all four SPOM sets.','✦',()=>spomN()===4],['s3','Warming Up','Be active 3 days in a row.','◍',()=>streaks().best>=3],['s7','Seven-Day Streak','Be active 7 days in a row.','✧',()=>streaks().best>=7],['l5','Level 5','Reach level 5.','⬢',()=>lv().l>=5],['l10','Level 10','Reach level 10.','⬣',()=>lv().l>=10],['ready','S-Rank Supreme','Finish syllabus, 3 revisions and SPOM.','★',()=>journey().ready]];
const vAch=()=>`<h1>Achievements</h1><p class="mu">Badges are calculated from your current progress; undoing progress can relock them.</p><div class="grid">${ACH.map(a=>{const u=a[4]();return`<div class="card ach ${u?'on':''}"><div class="ic" aria-hidden="true">${a[3]}</div><b>${a[1]}</b><br><small>${a[2]}</small><br><span class="tag ${u?'ok':''}">${u?'Unlocked':'Locked'}</span></div>`}).join('')}</div>`;
function editProfile(){const p=S.profile;form('Edit profile',[{n:'name',l:'Display name',x:'required maxlength=40'},{n:'groups',l:'Exam groups',t:'select',o:[['both','Both groups'],['g1','Group 1 only'],['g2','Group 2 only']]},{n:'target',l:'Target exam date',t:'date'},{n:'daily',l:'Daily study target (hours)',t:'number',x:'min=0 max=24 step=0.5'},{n:'pace',l:'Standard revision gap (days)',t:'number',x:'min=1 max=365'},{n:'goal',l:'Study goal',t:'textarea'}],{pace:7,...p},d=>{if(!d.name.trim())return'Name required';const pc=parseInt(d.pace);if(!(pc>=1&&pc<=365))return'Revision gap must be 1 to 365 days';Object.assign(p,{name:d.name.trim(),target:d.target,daily:d.daily,goal:d.goal,pace:pc});if(d.groups!==p.groups)setGroups(d.groups);else{save();R()}})}
function exportData(){const o=S?{app:'ARISE',format:1,syllabusVersion:SYLL?SYLL.version:null,exportedAt:new Date().toISOString(),progress:progressMap(),extra:extraOf()}:null,raw=o?JSON.stringify(o,null,2):(localStorage.getItem(KEY)||'{}'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.download='arise-backup-'+today()+'.json';a.click()}
function importData(inp){const f=inp.files[0];if(!f)return;if(f.size>5e6){toast('That file is too large to be an ARISE backup.',1);inp.value='';return}const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||o.app!=='ARISE'||!o.progress||typeof o.progress!=='object')throw 0;const pr={};Object.keys(o.progress).forEach(k=>{if(IDOK(k))pr[k]=NUM(o.progress[k],0,100,0)});const ex=cleanExtra(o.extra);confirmD('Import this backup? It is merged with your current progress: for every chapter the higher progress is kept, and nothing is deleted.',()=>{act(()=>{if(ex)mergeExtra(ex,false);applyProgress(pr)});toast('Backup imported')})}catch(e){toast('That file is not a valid ARISE backup.',1)}};r.readAsText(f);inp.value=''}
function resetAll(){confirmD('This permanently deletes all ARISE data on this device'+(CUSER&&S.uid===CUSER.uid?' and your cloud copy':'')+'.',async()=>{if(CUSER&&FDB&&S.uid===CUSER.uid){try{await FDB.collection('users').doc(CUSER.uid).delete()}catch(e){toast('Could not delete your cloud copy — nothing was removed. Try again.',1);return}}clearTimeout(STM);try{localStorage.removeItem(KEY)}catch(e){}S=null;AFT=null;PENDING=null;R()})}
const RINFO=[['E-Rank','Initiate',0,'Where every journey begins.'],['D-Rank','Apprentice',20,'Your foundations are forming.'],['C-Rank','Challenger',40,'Momentum is building.'],['B-Rank','Adept',60,'Past the halfway mark.'],['A-Rank','Elite',80,'The finish line is in sight.'],['S-Rank','Supreme',100,'Exam Ready — syllabus 100%, all 3 revisions and all 4 SPOM sets complete.']];
function rankCard(){const J=journey();return`<div class="card"><h3>Ranks</h3><p class="mu">Your rank follows your journey progress (60% syllabus + 30% three revisions + 10% SPOM sets), not XP. Level is separate and comes from XP. <b>S-Rank means Supreme — Exam Ready.</b></p>${RINFO.map((r,i)=>{const cur=J.rank===i,got=J.rank>i||(i===5&&J.ready);return`<div class="ch" ${cur?'style="background:#8B5CF61a;border-radius:10px;padding-left:8px;padding-right:8px"':''}><div style="flex:1;min-width:200px"><b>${r[0]} · ${r[1]}${i===5?' — Exam Ready':''}</b><br><small class="mu">${i===5?r[3]:'Unlocks at '+r[2]+'% journey progress. '+r[3]}</small></div><span class="tag ${cur?'v':got?'ok':''}">${cur?'You are here':got?'Reached ✓':'Locked'}</span></div>`}).join('')}<small class="mu">${J.ready?'You have reached the top rank.':`Your journey: ${J.j.toFixed(1)}% — ${(Math.min(5,J.rank+1)*20-J.j).toFixed(1)}% to ${RANKS[Math.min(5,J.rank+1)]}.`}</small></div>`}
function vProf(){const L=lv(),J=journey();return`<h1>Profile & Settings</h1><div class="card"><div class="row" style="flex-wrap:nowrap;gap:14px">${rankBadge(J.ready?'S-Rank Supreme':RANKS[J.rank],L.l)}<div><h3 style="margin:0">${esc(S.profile.name)}</h3><small class="mu">CA Final · ${{both:'Both groups',g1:'Group 1 only',g2:'Group 2 only'}[S.profile.groups]}${S.profile.target?' · exam '+fmt(S.profile.target):''}${+S.profile.daily?' · '+S.profile.daily+'h/day target':''}</small></div></div><div class="row" style="margin-top:10px"><button class="bt" onclick="editProfile()">Edit profile</button></div></div>
${rankCard()}<div class="card"><h3>How XP works</h3><p class="mu">XP is calculated from your current progress, so undoing something removes its XP and it can never be earned twice.</p><div class="mu" style="font-size:.88rem;line-height:1.7">Chapter completed: ${CFG.chap} + ${CFG.cw} × chapter weight · Revision 1 / 2 / 3: ${CFG.rev.join(' / ')}<br>Paper cleared: +${CFG.sub} · Full revision round of a paper: +${CFG.subRev.join(' / ')} · Group cleared: +${CFG.group}<br>SPOM set: ${CFG.spom} each, +${CFG.spomAll} for all four · Daily quest: ${CFG.quest} each (max ${CFG.qcap}/day)<br>Study day: ${CFG.day}/day · Streak bonus: +2…+${CFG.sc}/day · Weekly consistency: +${CFG.w5} (5 days) or +${CFG.w7} (7 days)<br>Levels: level n starts at ${CFG.base}×(n−1)² XP. Ranks follow your journey (E→S), not XP.</div></div>
${acctCard()}<div class="card"><h3>Data</h3><p class="mu">Your progress is always saved on this device first, so ARISE works offline. If you log in with Google it also syncs to your account. Export a backup now and then; Import merges a backup into your current progress, keeping the higher progress for every chapter.</p><div class="row"><button class="bt g2" onclick="exportData()">Export JSON</button><label class="bt g2" style="cursor:pointer">Import JSON<input type="file" accept="application/json,.json" hidden onchange="importData(this)"></label><button class="bt dn" onclick="resetAll()">Delete all data</button></div></div>`}
/* ---------- shell ---------- */
const VIEWS={dash:['Dashboard','◈',vDash],syl:['My Syllabus','▤',vSyl],quests:['Quests','⚔',vQuests],rev:['Revision','↻',vRev],time:['Study Time','◷',vTime],ach:['Achievements','✦',vAch],prof:['Profile','⚙',vProf]};
function nav(v){V=v;OPEN=null;R();scrollTo(0,0)}
function onboard(){const pn=PENDING?(PENDING.displayName||'').slice(0,40):'';$('#app').innerHTML=`<div class="land">${logoBig}<h1 class="mot">Rise beyond your limits</h1><p class="mis">A platform that turns the overwhelming syllabus into a series of achievable quests.</p><p class="mu">Your journey. Your quest. Your rise.</p>
${PENDING?`<div class="card"><b>Welcome${pn?', '+esc(pn):''}!</b><p class="mu">You are signed in with Google. Finish your profile and your progress will sync to your account.</p></div>`:`<div class="card"><h3>Sign up or sign in</h3><p class="mu">Use your Google account to save and sync your progress across devices. New here? The same button creates your account.</p><button class="bt" id="gb" style="width:100%">Continue with Google</button><p class="er" id="gerr" role="alert"></p><small class="mu">Prefer to stay offline? Skip this and fill in your profile below — your data stays in this browser.</small></div>`}
<form class="card" id="of"><h3>${PENDING?'Your profile':'Or continue without an account'}</h3><label>Display name<input name="name" maxlength="40" placeholder="e.g. Aarav" value="${esc(pn)}"></label><label>Qualification<select name="q"><option>CA Final</option></select></label><label>Which groups are you preparing?<select name="groups"><option value="both">Both groups</option><option value="g1">Group 1 only (Papers 1–3)</option><option value="g2">Group 2 only (Papers 4–6)</option></select></label><label>Target exam date (optional)<input type="date" name="target"></label><label>Daily study target in hours (optional)<input type="number" name="daily" min="0" max="24" step="0.5"></label><label>Standard revision gap in days (you can change it per paper later)<input type="number" name="pace" min="1" max="365" value="7"></label><label>Study goal (optional)<input name="goal" maxlength="120"></label><label>Where are you?<select name="mode"><option value="fresh">Starting fresh</option><option value="cont">Continuing my preparation</option></select></label><button class="bt" style="width:100%;margin-top:8px">Begin your ascent</button></form>
<div class="grid feat"><div><b>⚔</b>Your quests</div><div><b>▲</b>Ranks E → S</div><div><b>◷</b>Live timer</div></div>${FOOT}</div>`;
const gb=$('#gb');if(gb)gb.onclick=googleSignIn;
$('#of').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),pc=parseInt(d.pace);S=blank({name:d.name.trim()||pn||'Student',qual:'CA Final',groups:d.groups,target:d.target,daily:d.daily,goal:d.goal,mode:d.mode,pace:pc>=1&&pc<=365?pc:7});if(PENDING){S.uid=PENDING.uid;READY=true}PENDING=null;save();V='dash';R();startup()}}
function R0(){if(!S)return onboard();const sc=scrollY;$('#app').innerHTML=`<nav aria-label="Main">${logo}${Object.entries(VIEWS).map(([k,v])=>`<button class="${V===k?'on':''}" ${V===k?'aria-current="page"':''} onclick="nav('${k}')"><span aria-hidden="true">${v[1]}</span>${v[0]}</button>`).join('')}</nav><main>${tbar()}${VIEWS[V][2]()}${FOOT}</main>${V==='time'?'':tmBar()}`;scrollTo(0,sc);if(V==='syl'&&OPEN&&SQ)filterCh(SQ);if(V==='rev'&&RQ)filterRev()}
function R(){try{R0()}catch(e){fatal(e)}}
function fatal(e){console.error(e);document.getElementById('app').innerHTML=`<div class="land"><div class="card"><h2>Something went wrong</h2><p class="mu">${esc(e&&e.message||e)}</p><p>Your data is still saved in this browser. Try reloading. If it keeps happening, export a backup, then reset.</p><div class="row"><button class="bt" onclick="location.reload()">Reload</button><button class="bt g2" onclick="exportData()">Export backup</button><button class="bt dn" onclick="try{localStorage.removeItem('arise_v3')}catch(e){};location.reload()">Reset data</button></div></div></div>`}
window.addEventListener('error',e=>{const a=document.getElementById('app');if(a&&!a.children.length)fatal(e.error||e.message)});
window.addEventListener('unhandledrejection',e=>toast('Something went wrong: '+((e.reason&&e.reason.message)||e.reason),1));
function tmBar(){if(!S.timer)return'';const f=findCh(S.timer.cid);if(!f){S.timer=null;save();return''}return`<div class="tm" role="timer" aria-label="Study timer"><span>⏱ ${esc(f.c.name.slice(0,40))}</span><b class="tkc">${clock(elapsed())}</b>${S.timer.paused?'<button class="bt sm" onclick="resumeT()">▶</button>':'<button class="bt g2 sm" onclick="pauseT()">❚❚</button>'}<button class="bt sm" onclick="stopTimer(true)">Stop</button><button class="bt g2 sm" onclick="nav(\'time\')">Open</button></div>`}
/* ---------- start-up: always ask for a fresh weightage.json; update the cached copy only when its version is newer ---------- */
function validSyl(o){try{if(!o||typeof o.version!=='number'||!Array.isArray(o.papers)||!o.papers.length)return false;const seen=new Set();for(const p of o.papers){if(!/^[a-z0-9_]{1,20}$/.test(p.id)||typeof p.name!=='string'||!Array.isArray(p.sections))return false;for(const q of p.sections){if(typeof q.name!=='string'||!Array.isArray(q.chapters))return false;for(const c of q.chapters){if(!/^[a-z0-9_]{1,80}$/.test(c.id)||seen.has(c.id)||typeof c.name!=='string'||!(c.weight>0))return false;seen.add(c.id)}}}return true}catch(e){return false}}
const readSyl=()=>{try{const o=JSON.parse(localStorage.getItem(SYK));return validSyl(o)?o:null}catch(e){return null}};
async function fetchSyl(){const r=await fetch('weightage.json?nocache='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('The server answered '+r.status+'.');const o=await r.json();if(!validSyl(o))throw new Error('weightage.json is not in the expected format.');return o}
const cacheSyl=n=>{try{localStorage.setItem(SYK,JSON.stringify(n))}catch(e){}};
function fatalSyl(e){window.__ariseOK=true;document.getElementById('app').innerHTML=`<div class="land">${logoBig}<div class="card"><h2>Syllabus could not be loaded</h2><p class="mu">ARISE needs <b>weightage.json</b> next to index.html. ${esc(e&&e.message||e)}</p><p>Check your internet connection, make sure weightage.json is uploaded in the same folder as index.html, and open the app from your website link rather than by double-clicking the file. After one successful load, the syllabus is kept on your device for offline use.</p><div class="row"><button class="bt" onclick="location.reload()">Try again</button></div></div>${FOOT}</div>`}
function startApp(){S=loadState();R();window.__ariseOK=true;startup();initAuth()}
function boot(){SYLL=readSyl();
if(SYLL){startApp();fetchSyl().then(n=>{if(n.version>SYLL.version){SYLL=n;cacheSyl(n);if(S){fitSyl(S);save()}R();toast('Syllabus updated (version '+n.version+')')}}).catch(()=>{})}
else fetchSyl().then(n=>{SYLL=n;cacheSyl(n);startApp()}).catch(fatalSyl)}
boot();

</script></body></html>
